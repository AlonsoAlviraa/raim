[project]
name = "raim"
version = "0.1.0"
description = "RAIM: Regime-Adaptive, Inventory-Aware Market Making research system (SIMULATION/PAPER only)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.25",
  "websockets>=12.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
parquet = ["pyarrow>=14"]

[project.scripts]
raim = "raim.cli:main"

[dependency-groups]
dev = ["pytest>=7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
