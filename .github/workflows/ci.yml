name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - name: Install (pure Python)
        run: uv sync --python ${{ matrix.python }}
      - name: Tests, pure-Python backend
        run: uv run pytest -q
        env: { RAIM_BACKEND: python }
      - name: Build optional C++ extension (MSVC on Windows, gcc on Linux)
        run: uv pip install ./cpp
      - name: Tests incl. C++ parity + risk on C++ governor
        run: uv run pytest -q
        env: { RAIM_BACKEND: cpp }
      - name: Benchmark (informational)
        run: uv run raim bench --n 50000
  research-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Verdict rules tests (noise -> KILL, planted signal -> passes)
        run: uv run pytest -q tests/test_verdict.py tests/test_research_rules.py
      - name: Reject reports without prereg sha / data manifest
        run: uv run python scripts/ci/check_reports.py
      - name: Rules file must not change alongside results
        if: github.event_name == 'pull_request'
        run: uv run python scripts/ci/check_rules_separation.py origin/${{ github.base_ref }}
