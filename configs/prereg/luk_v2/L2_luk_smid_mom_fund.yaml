  - {id: V3, turnover_filter: ex_high_tercile, fund_mode: canonic_eps_rev, catalyst_mode: earnings_gap_only, exit_mode: ema21_or_rank, mkt_filter: iwm_qqq_ema50, stop_mode: none, reb_days: 21}
  - {id: V4, turnover_filter: ex_high_tercile, fund_mode: canonic_eps_rev, catalyst_mode: sue_or_gap, exit_mode: ema50_or_rank, mkt_filter: iwm_qqq_ema50, stop_mode: none, reb_days: 21}
