family: E1_funding_carry_xs
retroactive: false
hypothesis: >
  Cross-sectional funding carry: long the perps with the LOWEST trailing funding, short the
  HIGHEST, dollar-neutral. Earns funding spread plus mean reversion of crowded longs.
mechanism: >
  Leveraged trend-chasers pay to hold longs; scarce arbitrage capital (Schmeling, Schrimpf &
  Todorov, SSRN 4268371; Franz & Schmeling SSRN 3774118: carry predicts the cross-section).
signal: >
  f = mean funding over the last W days (settled, known at t); within PIT top-N rank f; long
  bottom 20%, short top 20%, equal weight, gross 1 (0.5 per side); rebalance every 7 days.
universe: PIT top-N Binance USDT-M perpetuals by trailing 30d median quote volume (perp daily klines), incl. delisted; >= 60d history
data: data.binance.vision futures/um monthly klines 1d + fundingRate (downloaded AFTER this commit); development < 2025-10-01; never >= 2026-10-13
costs: VIP0 perp taker 5 bps + tiered slippage by trailing perp volume (3/10/30/80 bps per side); funding paid/received per position
market_neutral: true
benchmark_r7: cash (rules v2)
metric: daily net Sharpe of purged walk-forward OOS (5 folds, plateau-centre selection)
validation: raim.research.verdict with configs/research_rules.yaml v2
grid:
  - {W: 3, N: 30}
  - {W: 3, N: 60}
  - {W: 7, N: 30}
  - {W: 7, N: 60}
  - {W: 14, N: 30}
  - {W: 14, N: 60}
