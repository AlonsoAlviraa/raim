family: E3_taker_flow_xs
retroactive: false
hypothesis: >
  Lagged net taker order flow, AFTER removing the part explained by the lagged return, predicts
  next-day/next-week returns positively in the cross-section (permanent price-impact component).
mechanism: >
  Order flow carries information; the transitory component reverses, the permanent one persists
  ("Order flow and cryptocurrency returns", J. Financial Markets 2026, S1386418126000029).
signal: >
  flow = sum(2*taker_buy_quote - quote_volume)/sum(quote_volume) over W days (from daily klines);
  if resid=yes replace flow by its residual from a same-day cross-sectional OLS on the W-day
  return; within PIT top-N rank; long top 20%, short bottom 20%, equal weight, gross 1;
  rebalance every W days.
universe: PIT top-N Binance USDT-M perpetuals by trailing 30d median quote volume (perp daily klines), incl. delisted; >= 60d history
data: data.binance.vision futures/um monthly klines 1d + fundingRate (downloaded AFTER this commit); development < 2025-10-01; never >= 2026-10-13
costs: VIP0 perp taker 5 bps + tiered slippage by trailing perp volume (3/10/30/80 bps per side); funding paid/received per position
market_neutral: true
benchmark_r7: cash (rules v2)
metric: daily net Sharpe of purged walk-forward OOS (5 folds, plateau-centre selection)
validation: raim.research.verdict with configs/research_rules.yaml v2
grid:
  - {W: 1, resid: yes, N: 30}
  - {W: 1, resid: yes, N: 60}
  - {W: 1, resid: no, N: 60}
  - {W: 7, resid: yes, N: 30}
  - {W: 7, resid: yes, N: 60}
  - {W: 7, resid: no, N: 60}
